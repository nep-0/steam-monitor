<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Steam Monitor</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>Steam Monitor</h1>
        <p>Local Steam presence and play-history tracker</p>
      </div>
      <div class="header-actions">
        <span id="health-status" class="health-status" role="status">Connecting...</span>
        <button id="poll-button" class="button button-primary" type="button">Poll now</button>
      </div>
    </header>

    <main class="page-content">
      <section class="panel add-panel" aria-labelledby="add-players-heading">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Monitor list</p>
            <h2 id="add-players-heading">Add players</h2>
          </div>
        </div>

        <form id="add-player-form" class="add-player-form">
          <label class="field field-wide" for="player-input">
            <span>Steam profiles</span>
            <textarea id="player-input" name="steam_id" rows="4" required placeholder="Paste SteamID64, profile URLs, vanity URLs, or s.team links"></textarea>
            <small>Enter one profile per line, or separate multiple entries with commas.</small>
          </label>
          <label class="field" for="nickname-input">
            <span>Nickname</span>
            <input id="nickname-input" name="nickname" type="text" placeholder="Optional for one player">
          </label>
          <div class="form-action">
            <button class="button button-primary" type="submit">Add to monitor</button>
          </div>
        </form>

        <div id="form-message" class="form-message" role="alert" hidden></div>
      </section>

      <section class="summary-grid" aria-label="Monitor summary">
        <article class="summary-card">
          <span class="summary-label">Monitored players</span>
          <strong id="total-players">0</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">Playing now</span>
          <strong id="playing-players">0</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">History period</span>
          <strong id="history-period">30 days</strong>
        </article>
      </section>

      <div class="dashboard-grid">
        <section class="panel" aria-labelledby="players-heading">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Live status</p>
              <h2 id="players-heading">Players</h2>
            </div>
          </div>
          <div id="players-list" class="item-list"></div>
        </section>

        <section class="panel" aria-labelledby="games-heading">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">Last 7 days</p>
              <h2 id="games-heading">Most played games</h2>
            </div>
          </div>
          <div id="games-list" class="item-list"></div>
        </section>
      </div>

      <section class="panel" aria-labelledby="sessions-heading">
        <div class="panel-heading session-heading">
          <div>
            <p class="eyebrow">Recorded sessions</p>
            <h2 id="sessions-heading">Recent completed sessions</h2>
          </div>
          <label class="period-control" for="history-days">
            <span>Show</span>
            <select id="history-days">
              <option value="7">Last 7 days</option>
              <option value="30" selected>Last 30 days</option>
              <option value="90">Last 90 days</option>
            </select>
          </label>
        </div>
        <div id="sessions-list" class="item-list"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
